services:
  postgres:
    image: postgres:17-alpine
    container_name: payment_postgres

    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_password

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U payments_user -d payments',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: